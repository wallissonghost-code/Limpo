<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Limpo — HTTP Lab</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#06090d;color:#dcffe6;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;padding:18px}.wrap{max-width:820px;margin:auto}.panel{background:#0c1216;border:1px solid #26372d;border-radius:16px;padding:17px}.title{font-size:20px}.sub{color:#7f9187;font-size:12px;margin:6px 0 18px}.row,.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.row{grid-template-columns:1fr 1fr}label,small{display:block;color:#82958a;font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}input{width:100%;background:#06090d;color:#effff3;border:1px solid #2b4033;border-radius:9px;padding:12px;font:inherit}button{border:0;border-radius:9px;padding:12px 15px;font:inherit;font-weight:800}.buttons{display:flex;gap:9px;margin:13px 0}#start{background:#5bea8d;color:#061109}#stop{background:#252d29;color:#d8e4dc}.hero{text-align:center;border:1px solid #23412e;border-radius:14px;padding:18px;background:#08100c}.clock{font-size:clamp(36px,9vw,65px);font-weight:900;color:#65f298;font-variant-numeric:tabular-nums}.card{margin-top:12px;background:#080d10;border:1px solid #1d2b23;border-radius:11px;padding:12px}.card b{font-size:17px}.green{color:#5bea8d}.terminal{height:230px;overflow:auto;margin-top:12px;background:#040608;border:1px solid #19241e;border-radius:10px;padding:11px;font-size:12px;line-height:1.55;color:#93a39a}.ok{color:#5bea8d}.warn{color:#ffd66b}.bad{color:#ff7b7b}@media(max-width:560px){.row,.stats{grid-template-columns:1fr}.terminal{height:260px}}</style></head><body><div class="wrap"><div class="title">$ LIMPO / HTTP LOGIN LAB</div><div class="sub">Cliente → POST /api/login → rate limit → lockout → validação fictícia</div><div class="panel"><div class="row"><div><label>PIN para testar</label><input id="pin" inputmode="numeric" maxlength="6" value="000000"></div><div><label>Endpoint</label><input id="endpoint" value="/api/login"></div></div><div class="buttons"><button id="start">▶ ENVIAR POST</button><button id="stop">■ LIMPAR</button></div><div class="hero"><small>Latência da última requisição</small><div id="clock" class="clock">0.0 ms</div></div><div class="stats"><div class="card"><small>Requisições</small><b id="count">0</b></div><div class="card"><small>Req / segundo</small><b id="speed" class="green">0.00</b></div><div class="card"><small>Status HTTP</small><b id="status">---</b></div></div><div id="terminal" class="terminal"><div class="ok">Laboratório pronto. O PIN do servidor é fictício.</div></div></div></div><script>const $=s=>document.querySelector(s);let count=0,first=0;function line(t,c=''){const d=document.createElement('div');d.className=c;d.textContent=t;$('#terminal').appendChild(d);$('#terminal').scrollTop=$('#terminal').scrollHeight}$('#start').onclick=async()=>{const pin=$('#pin').value.replace(/\D/g,'').padStart(6,'0').slice(-6),url=$('#endpoint').value.trim()||'/api/login';if(!first)first=performance.now();const t=performance.now();try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})}),ms=performance.now()-t;count++;const data=await r.json().catch(()=>({}));$('#clock').textContent=ms.toFixed(1)+' ms';$('#count').textContent=count.toLocaleString('pt-BR');$('#speed').textContent=(count/Math.max((performance.now()-first)/1000,.001)).toFixed(2);$('#status').textContent=r.status;line('POST '+url+' → '+r.status+' | '+ms.toFixed(1)+' ms | '+JSON.stringify(data),r.ok?'ok':r.status===429?'warn':'bad')}catch(e){$('#status').textContent='ERRO';line('Falha de rede: '+e.message,'bad')}};$('#stop').onclick=()=>{count=0;first=0;$('#count').textContent='0';$('#speed').textContent='0.00';$('#status').textContent='---';$('#clock').textContent='0.0 ms';$('#terminal').innerHTML='<div class="ok">Métricas locais limpas.</div>'}</script></body></html>
