<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Limpo — Laboratório de PIN</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#06090d;color:#dcffe6;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;padding:24px}.wrap{width:min(820px,100%);margin:auto}.title{font-size:20px;margin-bottom:6px}.sub{color:#7f9187;font-size:13px;margin-bottom:20px}.panel{border:1px solid #26372d;background:#0c1216;border-radius:16px;padding:17px;box-shadow:0 18px 60px #0008}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#91a49a;font-size:12px;margin-bottom:6px}input{width:100%;background:#070a0d;border:1px solid #2b4033;color:#effff3;border-radius:9px;padding:12px;font:inherit;font-size:16px}.buttons{display:flex;gap:10px;margin:14px 0}button{border:0;border-radius:9px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer}#start{background:#5bea8d;color:#061109}#stop{background:#252d29;color:#d8e4dc}.hero{border:1px solid #23412e;background:linear-gradient(180deg,#0b1710,#08100c);border-radius:14px;padding:20px;text-align:center;margin:10px 0 14px}.clockLabel{font-size:11px;letter-spacing:2px;color:#769181}.clock{font-size:clamp(36px,9vw,68px);font-weight:900;letter-spacing:2px;color:#65f298;text-shadow:0 0 24px #38d97845;font-variant-numeric:tabular-nums}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#080d10;border:1px solid #1d2b23;border-radius:11px;padding:13px}.card small{display:block;color:#75867d;font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}.card b{font-size:18px;color:#e9fff0}.card .green{color:#5bea8d}.barbox{margin-top:12px;background:#05080a;border-radius:99px;height:8px;overflow:hidden;border:1px solid #1b2720}.bar{height:100%;width:0;background:#5bea8d;transition:width .08s linear}.terminal{margin-top:14px;height:190px;overflow:auto;background:#040608;border:1px solid #19241e;border-radius:10px;padding:12px;font-size:12px;line-height:1.6;color:#8da096}.ok{color:#5bea8d}.found{color:#fff;font-weight:800;background:#174d2b;padding:4px 6px;border-radius:4px}@media(max-width:560px){body{padding:13px}.row{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.card:last-child{grid-column:1/-1}.terminal{height:180px}}</style></head>
<body><div class="wrap"><div class="title">$ LIMPO / laboratório de PIN</div><div class="sub">Benchmark educacional executado somente no navegador.</div><div class="panel"><div class="row"><div><label>PIN secreto (6 dígitos)</label><input id="target" inputmode="numeric" maxlength="6" value="900000"></div><div><label>Começar em</label><input id="initial" inputmode="numeric" maxlength="6" value="000000"></div></div><div class="buttons"><button id="start">▶ INICIAR TESTE</button><button id="stop">■ PARAR</button></div><div class="hero"><div class="clockLabel">TEMPO DECORRIDO</div><div id="clock" class="clock">00:00.000</div><div class="barbox"><div id="bar" class="bar"></div></div></div><div class="stats"><div class="card"><small>Número atual</small><b id="current" class="green">------</b></div><div class="card"><small>Comparações</small><b id="count">0</b></div><div class="card"><small>Dígitos testados / segundo</small><b id="speed" class="green">0/s</b></div></div><div id="terminal" class="terminal"><div class="ok">Sistema pronto.</div></div></div></div>
<script>
const $=s=>document.querySelector(s);let running=false,current=0,count=0,startTime=0,target=0,lastElapsed=0,raf=0;const BATCH=25000;
function line(t,c=''){const d=document.createElement('div');d.className=c;d.textContent=t;$('#terminal').appendChild(d);$('#terminal').scrollTop=$('#terminal').scrollHeight}
function elapsed(){return running?performance.now()-startTime:lastElapsed}
function formatTime(ms){const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000),x=Math.floor(ms%1000);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(x).padStart(3,'0')}
function refresh(){const ms=Math.max(elapsed(),1),sec=ms/1000;$('#clock').textContent=formatTime(ms);$('#current').textContent=String(Math.min(current,999999)).padStart(6,'0');$('#count').textContent=count.toLocaleString('pt-BR');$('#speed').textContent=Math.round(count/sec).toLocaleString('pt-BR')+'/s';$('#bar').style.width=(Math.min(current/1000000,1)*100).toFixed(2)+'%'}
function animate(){refresh();if(running)raf=requestAnimationFrame(animate)}
function finish(found){lastElapsed=performance.now()-startTime;running=false;cancelAnimationFrame(raf);refresh();const rate=Math.round(count/Math.max(lastElapsed/1000,.001));line((found?'✓ PIN encontrado: '+String(target).padStart(6,'0'):'Fim do espaço de busca.')+' | '+formatTime(lastElapsed)+' | '+rate.toLocaleString('pt-BR')+' comparações/s',found?'found':'ok')}
function runBatch(){if(!running)return;const end=Math.min(current+BATCH,1000000);for(;current<end;current++){count++;if(current===target){current++;finish(true);return}}if(current>=1000000){finish(false);return}setTimeout(runBatch,0)}
$('#stop').onclick=()=>{if(running){lastElapsed=performance.now()-startTime;running=false;cancelAnimationFrame(raf);refresh();line('Processo interrompido em '+formatTime(lastElapsed)+'.','ok')}};
$('#start').onclick=()=>{if(running)return;target=Math.min(Math.max(parseInt($('#target').value.replace(/\D/g,'')||'0',10),0),999999);current=Math.min(Math.max(parseInt($('#initial').value.replace(/\D/g,'')||'0',10),0),999999);count=0;lastElapsed=0;startTime=performance.now();running=true;$('#terminal').innerHTML='';line('Benchmark iniciado — lotes de '+BATCH.toLocaleString('pt-BR')+' comparações.','ok');animate();runBatch()};
refresh();
</script></body></html>
